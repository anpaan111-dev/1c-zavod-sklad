<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1С:ERP НЕФАЗ — Учет и выдача ТМЦ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #EFECE4;
      color: #1F2428;
      padding-bottom: 72px;
    }
    header {
      background: #232A32;
      color: #fff;
      border-bottom: 4px solid #EAB308;
      padding: 10px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .badge {
      background: #EAB308;
      color: #1F2428;
      font-weight: 800;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 2px;
    }
    .btn {
      border: 1px solid #9CA3AF;
      background: #fff;
      color: #1F2428;
      font-weight: 700;
      font-size: 12px;
      padding: 7px 11px;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-amber { background: #EAB308; border-color: #CA8A04; color: #1F2428; }
    .btn-green { background: #15803D; border-color: #166534; color: #fff; }
    .btn-blue { background: #1D4ED8; border-color: #1E40AF; color: #fff; }
    .btn-dark { background: #374151; border-color: #4B5563; color: #fff; }
    .btn-red { background: #DC2626; border-color: #B91C1C; color: #fff; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .container { max-width: 1100px; margin: 0 auto; padding: 12px; }
    .card {
      background: #F9F8F4;
      border: 1px solid #C8C3B8;
      border-radius: 3px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .title { font-size: 15px; font-weight: 800; margin: 0 0 4px 0; }
    .sub { font-size: 12px; color: #57534E; margin: 0; }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #A8A29E;
      border-radius: 3px;
      font-size: 13px;
      background: #fff;
      color: #1F2428;
    }
    label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; color: #44403C; margin-bottom: 4px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    @media (max-width: 640px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; }
    th { background: #E5E1D6; text-align: left; padding: 8px; border-bottom: 1px solid #A8A29E; }
    td { padding: 8px; border-bottom: 1px solid #E7E5E4; vertical-align: top; }
    .table-wrap { overflow-x: auto; border: 1px solid #C8C3B8; border-radius: 3px; }
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #232A32;
      border-top: 2px solid #EAB308;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      z-index: 40;
    }
    .nav-btn {
      background: transparent;
      border: none;
      border-right: 1px solid #374151;
      color: #E5E7EB;
      font-weight: 700;
      font-size: 11px;
      padding: 12px 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
    }
    .nav-btn.active { background: #EAB308; color: #1F2428; }
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72);
      display: flex; align-items: center; justify-content: center;
      padding: 10px; z-index: 60; overflow-y: auto;
    }
    .modal {
      background: #F9F8F4; border: 2px solid #232A32; border-radius: 3px;
      width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
    }
    .modal-head {
      background: #232A32; color: #fff; padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-body { padding: 14px; }
    .alert-red {
      background: #FEE2E2; border: 2px solid #DC2626; color: #7F1D1D;
      padding: 10px; border-radius: 3px; margin: 8px 0; font-size: 12px;
    }
    .pill {
      display: inline-block; background: #E7E5E4; border: 1px solid #D6D3D1;
      padding: 4px 8px; border-radius: 3px; font-size: 11px; margin: 2px; cursor: pointer;
    }
    .toast {
      position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
      background: #1F2428; color: #fff; border: 1px solid #EAB308;
      padding: 8px 14px; border-radius: 3px; font-size: 12px; z-index: 80;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    (function () {
      const STORAGE_KEY = "nefaz_erp_standalone_v1";

      function genBarcode(seedStr) {
        let hash = 0;
        const src = String(seedStr || Date.now());
        for (let i = 0; i < src.length; i++) hash = (hash * 31 + src.charCodeAt(i)) % 1000000000000;
        const base12 = String(460000000000 + (Math.abs(hash) % 9999999999)).slice(0, 12);
        let sum = 0;
        for (let i = 0; i < 12; i++) sum += parseInt(base12[i], 10) * (i % 2 === 0 ? 1 : 3);
        return base12 + String((10 - (sum % 10)) % 10);
      }

      function barcodeSVG(code) {
        const digits = String(code || "4607001000014").split("").map(d => parseInt(d, 10) || 0);
        let x = 6, rects = "";
        digits.forEach((d, idx) => {
          const w1 = (d % 3) + 1;
          const w2 = ((d + idx) % 2) + 1;
          rects += `<rect x="${x}" y="2" width="${w1}" height="24" fill="#111"/>`;
          x += w1 + w2;
          rects += `<rect x="${x}" y="2" width="1" height="24" fill="#111"/>`;
          x += 2;
        });
        return `<div style="display:inline-block;background:#fff;border:1px solid #ccc;padding:3px 6px;text-align:center">
          <svg viewBox="0 0 ${x + 6} 28" width="120" height="28">${rects}</svg>
          <div style="font-family:monospace;font-size:10px">${code}</div>
        </div>`;
      }

      function qrSVG(payload, size) {
        const s = size || 120;
        const text = String(payload || "NEFAZ");
        const g = 21;
        let seed = 1337;
        for (let i = 0; i < text.length; i++) seed = (seed * 16777619) ^ text.charCodeAt(i);
        let cells = "";
        function finder(r0, c0) {
          for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {
            if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
              cells += `<rect x="${c0 + c + 1}" y="${r0 + r + 1}" width="1" height="1" fill="#111"/>`;
            }
          }
        }
        finder(0, 0); finder(0, g - 7); finder(g - 7, 0);
        for (let r = 0; r < g; r++) for (let c = 0; c < g; c++) {
          if ((r < 8 && c < 8) || (r < 8 && c >= g - 8) || (r >= g - 8 && c < 8)) continue;
          seed = (seed * 1103515245 + 12345) & 0x7fffffff;
          if ((seed % 100) < 46) cells += `<rect x="${c + 1}" y="${r + 1}" width="1" height="1" fill="#111"/>`;
        }
        return `<div style="display:inline-block;background:#fff;border:1px solid #ccc;padding:6px;text-align:center">
          <svg width="${s}" height="${s}" viewBox="0 0 ${g + 2} ${g + 2}">${cells}</svg>
          <div style="font-family:monospace;font-size:10px;margin-top:3px">${text}</div>
        </div>`;
      }

      const DEFAULT_STATE = {
        tab: "warehouse",
        accounts: [
          { id: "acc-1", fio: "Смирнов Дмитрий Викторович", role: "Кладовщик", qrToken: "QR-USER-SMIRNOV-01" },
          { id: "acc-2", fio: "Галиев Марат Рамилевич", role: "Мастер смены", qrToken: "QR-USER-GALIEV-02" }
        ],
        activeAccountId: "acc-1",
        people: [
          { id: "p-1", fio: "Иванов Алексей Сергеевич", department: "Сборочный цех №2" },
          { id: "p-2", fio: "Петров Максим Олегович", department: "Участок климата" },
          { id: "p-3", fio: "Сидоров Андрей Николаевич", department: "Сборочный цех №1" }
        ],
        models: [
          {
            id: "NEFAZ-5299-40-57",
            name: "НЕФАЗ-5299-40-57 (КЖГ, городской)",
            qrCode: "QR-MODEL-NEFAZ-5299-40-57",
            bom: [
              { id: "b1", name: "Компрессор климатической установки Bitzer", unit: "шт", applicability: 1, barcode: "4607001000014" },
              { id: "b2", name: "Конденсатор крышный в сборе с вентиляторами", unit: "шт", applicability: 2, barcode: "4607001000021" },
              { id: "b3", name: "Испаритель салонный передний", unit: "шт", applicability: 1, barcode: "4607001000038" },
              { id: "b4", name: "Блок управления климат-контролем (ECU)", unit: "шт", applicability: 1, barcode: "4607001000052" },
              { id: "b5", name: "Отопитель салонный жидкостный Webasto", unit: "шт", applicability: 2, barcode: "4607001000076" }
            ]
          },
          {
            id: "NEFAZ-5299-30-57-EL",
            name: "НЕФАЗ-5299-30-57 Электробус",
            qrCode: "QR-MODEL-NEFAZ-5299-30-57-EL",
            bom: [
              { id: "e1", name: "Электрический компрессор HVAC 600V", unit: "шт", applicability: 1, barcode: "4607002000013" },
              { id: "e2", name: "Крышный климатический блок (тепловой насос)", unit: "шт", applicability: 2, barcode: "4607002000020" }
            ]
          }
        ],
        issues: [
          {
            id: "iss-1",
            docNumber: "ВД-000101",
            dateTime: "2026-11-19 09:15",
            modelId: "NEFAZ-5299-40-57",
            bodyNumber: "XTY529900R0004812",
            recipient: "Иванов Алексей Сергеевич",
            issuer: "Смирнов Дмитрий Викторович",
            comment: "Сборочный цех №2",
            items: [
              { itemId: "b1", name: "Компрессор климатической установки Bitzer", unit: "шт", qty: 1, serialNumber: "SN-BIT-88412" }
            ]
          }
        ]
      };

      let state;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        state = raw ? Object.assign({}, DEFAULT_STATE, JSON.parse(raw)) : DEFAULT_STATE;
      } catch (e) {
        state = DEFAULT_STATE;
      }

      let ui = {
        selectedModelId: state.models[0].id,
        reportModelId: state.models[0].id,
        reportBody: "",
        reportFilter: "",
        issueSearch: "",
        toast: "",
        modal: null, // 'wizard' | 'auth' | 'db' | 'import' | 'qr'
        qrData: null,
        authTab: "login",
        dbTab: "models",
        dbModelId: state.models[0].id,
        editItemId: null,
        editModelId: null,
        editPersonId: null,
        wizStep: 1,
        wizModelId: state.models[0].id,
        wizModelText: state.models[0].name,
        wizBody: "",
        wizItemId: "",
        wizSerial: "",
        wizQty: 1,
        wizDraft: [],
        wizRecipient: "",
        wizComment: "",
        camActive: false,
        camTarget: ""
      };

      let camStream = null;

      function stopCam() {
        if (camStream) {
          camStream.getTracks().forEach(t => t.stop());
          camStream = null;
        }
        ui.camActive = false;
      }

      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        render();
      }

      function notify(msg) {
        ui.toast = msg;
        render();
        setTimeout(() => { ui.toast = ""; render(); }, 2800);
      }

      function esc(str) {
        return String(str || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function getActiveAcc() {
        return state.accounts.find(a => a.id === state.activeAccountId) || state.accounts[0];
      }

      function getIssuedQty(body, itemId, itemName) {
        const clean = (body || "").trim().toUpperCase();
        if (!clean) return 0;
        let total = 0;
        state.issues.forEach(iss => {
          if ((iss.bodyNumber || "").trim().toUpperCase() === clean) {
            (iss.items || []).forEach(it => {
              if (it.itemId === itemId || it.name === itemName) total += Number(it.qty) || 0;
            });
          }
        });
        ui.wizDraft.forEach(it => {
          if (it.itemId === itemId || it.name === itemName) total += Number(it.qty) || 0;
        });
        return total;
      }

      function startCam(target) {
        stopCam();
        ui.camActive = true;
        ui.camTarget = target;
        render();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          notify("Камера недоступна в браузере — введите код вручную");
          return;
        }
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } })
          .then(stream => {
            camStream = stream;
            const v = document.getElementById("camVideo");
            if (v) { v.srcObject = stream; v.play(); }
            if ("BarcodeDetector" in window) {
              const det = new window.BarcodeDetector();
              const tick = () => {
                if (!camStream || !v) return;
                if (v.readyState === 4) {
                  det.detect(v).then(codes => {
                    if (codes && codes.length > 0 && codes[0].rawValue) {
                      const val = codes[0].rawValue.trim();
                      stopCam();
                      handleScanned(target, val);
                    } else if (camStream) requestAnimationFrame(tick);
                  }).catch(() => { if (camStream) requestAnimationFrame(tick); });
                } else {
                  requestAnimationFrame(tick);
                }
              };
              requestAnimationFrame(tick);
            }
          })
          .catch(() => notify("Нет доступа к камере — введите значение вручную"));
      }

      function handleScanned(target, val) {
        const q = val.toLowerCase();
        if (target === "auth") {
          const acc = state.accounts.find(a => a.qrToken.toLowerCase() === q || a.fio.toLowerCase().includes(q));
          if (acc) { state.activeAccountId = acc.id; ui.modal = null; notify("Вход выполнен: " + acc.fio); save(); }
          else { notify("Считан QR: " + val); render(); }
        } else if (target === "model") {
          const m = state.models.find(x => x.qrCode.toLowerCase() === q || x.id.toLowerCase() === q || x.name.toLowerCase().includes(q));
          if (m) { ui.wizModelId = m.id; ui.wizModelText = m.name; notify("Модель: " + m.name); }
          else { ui.wizModelText = val; notify("Считано: " + val); }
          render();
        } else if (target === "item") {
          const m = state.models.find(x => x.id === ui.wizModelId) || state.models[0];
          const it = m.bom.find(b => b.barcode.toLowerCase() === q || b.name.toLowerCase().includes(q));
          if (it) {
            ui.wizItemId = it.id;
            const rem = Math.max(0, it.applicability - getIssuedQty(ui.wizBody, it.id, it.name));
            ui.wizQty = rem > 0 ? 1 : 0;
            notify("Найдено: " + it.name);
          } else {
            notify("Позиция не найдена в составе");
          }
          render();
        }
      }

      function render() {
        const acc = getActiveAcc();
        const activeModel = state.models.find(m => m.id === ui.selectedModelId) || state.models[0];
        let html = "";

        if (ui.toast) html += `<div class="toast">${esc(ui.toast)}</div>`;

        html += `
          <header>
            <div>
              <div style="display:flex;align-items:center;gap:6px">
                <span class="badge">1С:ERP</span>
                <strong style="font-size:13px">НЕФАЗ • КЛИМАТИЧЕСКИЕ СИСТЕМЫ</strong>
              </div>
              <div style="font-size:11px;color:#D6D3D1;margin-top:2px">Аккаунт: <strong>${esc(acc ? acc.fio : "")}</strong></div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="btn btn-dark" onclick="AppAPI.openDb()">База</button>
              <button class="btn btn-dark" onclick="AppAPI.openAuth()">QR-вход</button>
              <button class="btn btn-amber" onclick="AppAPI.openWizard()">Выдать ТМЦ</button>
            </div>
          </header>
          <div class="container">
        `;

        // ВКЛАДКА: СОСТАВ ИЗДЕЛИЯ
        if (state.tab === "bom") {
          html += `
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
                <div>
                  <h2 class="title">Состав изделия</h2>
                  <p class="sub">Номенклатура, применяемость, QR модели и штрихкоды</p>
                </div>
                <div style="display:flex;gap:6px">
                  <button class="btn btn-blue" onclick="AppAPI.openImport()">Загрузить состав</button>
                  <button class="btn" onclick="AppAPI.showQr('QR-код модели', '${esc(activeModel.name)}', '${esc(activeModel.qrCode)}')">QR модели</button>
                </div>
              </div>
              <label>Модель автобуса:</label>
              <select onchange="AppAPI.selectModel(this.value)">
                ${state.models.map(m => `<option value="${esc(m.id)}" ${m.id === activeModel.id ? "selected" : ""}>${esc(m.name)} (${esc(m.qrCode)})</option>`).join("")}
              </select>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>Наименование</th><th>Примен.</th><th>Штрихкод</th></tr>
                </thead>
                <tbody>
                  ${activeModel.bom.map(b => `
                    <tr>
                      <td><strong>${esc(b.name)}</strong></td>
                      <td style="white-space:nowrap">${b.applicability} ${esc(b.unit)}</td>
                      <td>${barcodeSVG(b.barcode)}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          `;
        }

        // ВКЛАДКА: УЧЕТ ТМЦ В СКЛАДЕ — ЖУРНАЛ ВЫДАЧИ
        if (state.tab === "warehouse") {
          const q = ui.issueSearch.toLowerCase();
          const list = state.issues.filter(i =>
            !q || i.docNumber.toLowerCase().includes(q) || i.bodyNumber.toLowerCase().includes(q) ||
            i.modelId.toLowerCase().includes(q) || i.recipient.toLowerCase().includes(q)
          );
          html += `
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
                <div>
                  <h2 class="title">Учет ТМЦ в складе — Журнал выдачи</h2>
                  <p class="sub">Выдача по модели, кузову, получателю и ответственному</p>
                </div>
                <button class="btn btn-green" onclick="AppAPI.openWizard()">+ Выдать ТМЦ со склада</button>
              </div>
              <input placeholder="Поиск по кузову, модели, получателю..." value="${esc(ui.issueSearch)}" oninput="AppAPI.setSearch(this.value)" />
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr><th>№ / Дата</th><th>Модель / Кузов</th><th>Получатель / Ответственный</th><th>Выданные ТМЦ</th></tr>
                </thead>
                <tbody>
                  ${list.map(iss => `
                    <tr>
                      <td style="white-space:nowrap"><strong>${esc(iss.docNumber)}</strong><div style="color:#57534E;font-size:11px">${esc(iss.dateTime)}</div></td>
                      <td><div>${esc(iss.modelId)}</div><strong style="font-family:monospace">${esc(iss.bodyNumber)}</strong></td>
                      <td><div>Получил: <strong>${esc(iss.recipient)}</strong></div><div style="font-size:11px;color:#57534E">Выдал: ${esc(iss.issuer)}</div></td>
                      <td>
                        ${(iss.items || []).map(it => `<div>• ${esc(it.name)} — <strong>${it.qty} ${esc(it.unit)}</strong> ${it.serialNumber ? `<span style="font-family:monospace;color:#444">[S/N: ${esc(it.serialNumber)}]</span>` : ""}</div>`).join("")}
                      </td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          `;
        }

        // ВКЛАДКА: ОТЧЕТ ПО ВЫДАЧЕ
        if (state.tab === "report") {
          const repModel = state.models.find(m => m.id === ui.reportModelId) || state.models[0];
          const cleanBody = ui.reportBody.trim().toUpperCase();
          const f = ui.reportFilter.trim().toLowerCase();
          const rows = repModel.bom
            .filter(b => !f || b.name.toLowerCase().includes(f))
            .map(b => {
              let issued = 0, lastDate = "—", lastRec = "—", lastIss = "—";
              state.issues.forEach(iss => {
                if (iss.modelId !== repModel.id) return;
                if (cleanBody && (iss.bodyNumber || "").toUpperCase() !== cleanBody) return;
                const found = (iss.items || []).find(it => it.itemId === b.id || it.name === b.name);
                if (found) {
                  issued += Number(found.qty) || 0;
                  lastDate = iss.dateTime;
                  lastRec = iss.recipient;
                  lastIss = iss.issuer;
                }
              });
              return { b, issued, rem: Math.max(0, b.applicability - issued), lastDate, lastRec, lastIss };
            });

          html += `
            <div class="card">
              <h2 class="title">Отчет по выдаче (Комплектация кузова)</h2>
              <p class="sub" style="margin-bottom:10px">Укажите модель, номер кузова и номенклатуру</p>
              <div class="grid-3">
                <div>
                  <label>Модель автобуса</label>
                  <select onchange="AppAPI.setRepModel(this.value)">
                    ${state.models.map(m => `<option value="${esc(m.id)}" ${m.id === repModel.id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}
                  </select>
                </div>

                  ${ui.dbTab === "items" ? `

                          <button class="btn btn-red" onclick="AppAPI.delPerson('${esc(p.id)}')">Удал.</button>
                        </div>
                      </div>
                    `).join("")}
                  ` : ""}
                </div>
              </div>
            </div>
          `;
        }

        if (ui.modal === "import") {

                <div class="modal-head">

                  <button class="btn btn-dark" onclick="AppAPI.closeModal()">✕</button>

                  <div style="margin:8px 0">
                    <label>Модель автобуса:</label>
                    <select id="impModel">
                      ${state.models.map(m => `<option value="${esc(m.id)}" ${m.id === activeModel.id ? "selected" : ""}>${esc(m.name)}</option>`).join("")}

        // МОДАЛЬНОЕ ОКНО: ПРОСМОТР QR
        if (ui.modal === "qr" && ui.qrData) {
          html += `
            <div class="modal-bg" onclick="AppAPI.closeModal()">

        document.getElementById("app").innerHTML = html;

      window.AppAPI = {
        setTab(t) { state.tab = t; save(); },
        selectModel(id) { ui.selectedModelId = id; render(); },
        setSearch(v) { ui.issueSearch = v; render(); },
        setRepModel(v) { ui.reportModelId = v; render(); },
        setRepBody(v) { ui.reportBody = v; render(); },
        setRepFilter(v) { ui.reportFilter = v; render(); },
        closeModal() { stopCam(); ui.modal = null; render(); },
        openWizard() {
          const m = state.models.find(x => x.id === ui.selectedModelId) || state.models[0];
          ui.modal = "wizard"; ui.wizStep = 1; ui.wizModelId = m.id; ui.wizModelText = m.name;
          ui.wizBody = ""; ui.wizItemId = ""; ui.wizSerial = ""; ui.wizQty = 1; ui.wizDraft = []; ui.wizRecipient = "";
          render();
        },
        openAuth() { ui.modal = "auth"; ui.authTab = "login"; render(); },
        setAuthTab(t) { stopCam(); ui.authTab = t; render(); },
        loginAcc(id) { state.activeAccountId = id; ui.modal = null; notify("Вход выполнен"); save(); },
        loginManual() {
          const v = (document.getElementById("qrAuthInp")?.value || "").trim().toLowerCase();
          const acc = state.accounts.find(a => a.qrToken.toLowerCase() === v || a.fio.toLowerCase().includes(v));
          if (acc) { state.activeAccountId = acc.id; ui.modal = null; notify("Вход: " + acc.fio); save(); }
          else notify("Аккаунт не найден");
        },
        registerAcc() {
          const fio = (document.getElementById("regFioInp")?.value || "").trim();
          const role = (document.getElementById("regRoleInp")?.value || "Кладовщик").trim();
          if (!fio) return notify("Введите ФИО");
          const id = "acc-" + Date.now();
          state.accounts.push({ id, fio, role, qrToken: "QR-USER-" + Math.floor(1000 + Math.random() * 9000) });

          ui.authTab = "qrs";
          notify("Аккаунт зарегистрирован");
          save();
        },
        openDb() { ui.modal = "db"; render(); },
        setDbTab(t) { ui.dbTab = t; render(); },
        setDbModel(id) { ui.dbModelId = id; render(); },
        addModel() {
          const name = (document.getElementById("dbModelNameInp")?.value || "").trim();
          if (!name) return notify("Введите название модели");
          const id = "NEFAZ-" + Math.floor(1000 + Math.random() * 9000);
          state.models.push({ id, name, qrCode: "QR-MODEL-" + id, bom: [] });
          ui.dbModelId = id;
          notify("Модель добавлена");
          save();
        },
        renameModel(id) {
          const m = state.models.find(x => x.id === id);
          if (!m) return;
          const next = prompt("Новое название модели:", m.name);
          if (next && next.trim()) { m.name = next.trim(); notify("Модель изменена"); save(); }
        },
        delModel(id) {
          if (state.models.length <= 1) return notify("Нельзя удалить последнюю модель");
          state.models = state.models.filter(m => m.id !== id);
          ui.selectedModelId = state.models[0].id;
          ui.dbModelId = state.models[0].id;
          notify("Модель удалена");
          save();
        },
        addItem() {
          const name = (document.getElementById("dbItemName")?.value || "").trim();
          const app = Math.max(1, parseInt(document.getElementById("dbItemApp")?.value, 10) || 1);
          if (!name) return notify("Введите наименование");
          const m = state.models.find(x => x.id === ui.dbModelId) || state.models[0];
          m.bom.push({ id: "b-" + Date.now(), name, unit: "шт", applicability: app, barcode: genBarcode(name + Date.now()) });
          notify("Номенклатура добавлена");
          save();
        },
        editItem(mId, bId) {
          const m = state.models.find(x => x.id === mId);
          const b = m && m.bom.find(x => x.id === bId);
          if (!b) return;
          const n = prompt("Наименование:", b.name);
          if (n && n.trim()) b.name = n.trim();
          const a = prompt("Применяемость:", b.applicability);
          if (a && parseInt(a, 10) > 0) b.applicability = parseInt(a, 10);
          notify("Номенклатура обновлена");
          save();
        },
        delItem(mId, bId) {
          const m = state.models.find(x => x.id === mId);
          if (m) m.bom = m.bom.filter(x => x.id !== bId);
          notify("Номенклатура удалена");
          save();
        },
        addPerson() {
          const fio = (document.getElementById("dbPersonFio")?.value || "").trim();
          const department = (document.getElementById("dbPersonDep")?.value || "Цех").trim();
          if (!fio) return notify("Введите ФИО");

          notify("Сотрудник добавлен");
          save();
        },
        editPerson(id) {
          const p = state.people.find(x => x.id === id);
          if (!p) return;
          const f = prompt("ФИО:", p.fio);
          if (f && f.trim()) p.fio = f.trim();
          const d = prompt("Подразделение:", p.department);
          if (d && d.trim()) p.department = d.trim();
          notify("Данные обновлены");
          save();
        },
        delPerson(id) {
          state.people = state.people.filter(x => x.id !== id);
          notify("Сотрудник удалён");
          save();
        },
        openImport() { ui.modal = "import"; render(); },
        runImport() {
          const txt = document.getElementById("impText")?.value || "";
          const mId = document.getElementById("impModel")?.value;
          const m = state.models.find(x => x.id === mId);
          if (!m) return;
          txt.split("\n").map(l => l.trim()).filter(Boolean).forEach((line, idx) => {
            const p = line.split("|").map(s => s.trim());
            m.bom.push({
              id: "imp-" + Date.now() + "-" + idx,
              name: p[0] || "Деталь",
              unit: p[1] || "шт",
              applicability: Math.max(1, parseInt(p[2], 10) || 1),
              barcode: genBarcode(p[0] + idx)
            });
          });
          ui.modal = null;
          notify("Состав загружен");
          save();
        },
        showQr(title, sub, code) { ui.modal = "qr"; ui.qrData = { title, sub, code }; render(); },
        startCam, stopCam,
        setWizModelText(v) { ui.wizModelText = v; },
        pickWizModel(id) {
          const m = state.models.find(x => x.id === id);
          if (m) { ui.wizModelId = m.id; ui.wizModelText = m.name; render(); }
        },
        setWizBody(v) { ui.wizBody = v; },
        setWizStep(s) { stopCam(); ui.wizStep = s; render(); },
        goStep2() {
          if (!ui.wizBody.trim()) return notify("Введите номер кузова");
          stopCam(); ui.wizStep = 2; render();
        },
        lookupItem(v) {
          const q = v.trim().toLowerCase();
          if (!q) return;
          const m = state.models.find(x => x.id === ui.wizModelId) || state.models[0];
          const it = m.bom.find(b => b.barcode.toLowerCase() === q || b.name.toLowerCase().includes(q));
          if (it) {
            ui.wizItemId = it.id;
            const rem = Math.max(0, it.applicability - getIssuedQty(ui.wizBody, it.id, it.name));
            ui.wizQty = rem > 0 ? 1 : 0;
            render();
          }
        },
        pickWizItem(id) {
          ui.wizItemId = id;
          const m = state.models.find(x => x.id === ui.wizModelId) || state.models[0];
          const it = m.bom.find(b => b.id === id);
          if (it) {
            const rem = Math.max(0, it.applicability - getIssuedQty(ui.wizBody, it.id, it.name));
            ui.wizQty = rem > 0 ? 1 : 0;
          }
          render();
        },
        setWizSerial(v) { ui.wizSerial = v; },
        setWizQty(v) { ui.wizQty = parseInt(v, 10) || 1; },
        addDraft() {
          const m = state.models.find(x => x.id === ui.wizModelId) || state.models[0];
          const it = m.bom.find(b => b.id === ui.wizItemId);
          if (!it) return;
          const rem = Math.max(0, it.applicability - getIssuedQty(ui.wizBody, it.id, it.name));
          const qty = Math.min(rem, Math.max(1, Number(ui.wizQty) || 1));
          if (qty <= 0) return notify("Лимит по применяемости исчерпан");
          ui.wizDraft.push({ itemId: it.id, name: it.name, unit: it.unit, qty, serialNumber: ui.wizSerial.trim() });
          ui.wizItemId = ""; ui.wizSerial = ""; ui.wizQty = 1;
          notify("Добавлено — можно выбрать следующую позицию");
          render();
        },
        goStep3() {
          if (ui.wizDraft.length === 0) return notify("Добавьте хотя бы одну позицию");
          stopCam(); ui.wizStep = 3; render();
        },
        setWizRec(v) { ui.wizRecipient = v; render(); },
        setWizComment(v) { ui.wizComment = v; },
        finishIssue() {
          if (!ui.wizRecipient.trim()) return notify("Укажите ФИО получателя");
          const now = new Date();
          const p = n => String(n).padStart(2, "0");
          const dt = `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}`;
          const doc = "ВД-" + String(101 + state.issues.length).padStart(6, "0");
          const acc = getActiveAcc();
          state.issues.unshift({
            id: "iss-" + Date.now(),
            docNumber: doc,
            dateTime: dt,
            modelId: ui.wizModelId,
            bodyNumber: ui.wizBody.trim().toUpperCase(),
            recipient: ui.wizRecipient.trim(),
            issuer: acc ? acc.fio : "Кладовщик",
            comment: ui.wizComment.trim(),
            items: ui.wizDraft
          });
          ui.modal = null;
          notify("Проведен документ " + doc);
          save();
        }
      };

      render();
    })();
  </script>
</body>
</html>
