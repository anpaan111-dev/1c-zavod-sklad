// Генерация детерминированного штрихкода EAN-13
const generateBarcode = (seedStr = "") => {
let hash = 0;
const source = seedStr || String(Date.now()) + Math.random();
for (let i = 0; i < source.length; i++) {
hash = (hash * 31 + source.charCodeAt(i)) % 1000000000000;
}
const base12 = String(460000000000 + (Math.abs(hash) % 9999999999)).slice(0, 12);
let sum = 0;
for (let i = 0; i < 12; i++) {
const digit = parseInt(base12[i], 10);
sum += i % 2 === 0 ? digit : digit * 3;
}
const checkDigit = (10 - (sum % 10)) % 10;
return base12 + String(checkDigit);
};

// SVG Штрихкод
const BarcodeSVG = ({ value, height = 36, showText = true }) => {
const digits = String(value || "4607001234567").split("").map((d) => parseInt(d, 10) || 0);
const bars = [];
digits.forEach((d, idx) => {
const w1 = (d % 3) + 1;
const w2 = ((d + idx) % 2) + 1;
bars.push({ w: w1, fill: true });
bars.push({ w: w2, fill: false });
bars.push({ w: 1, fill: true });
bars.push({ w: 1, fill: false });
});
const totalWidth = bars.reduce((acc, b) => acc + b.w, 0) + 16;

return (
<div className="inline-flex flex-col items-center bg-white px-2 py-1 border border-stone-300 rounded-sm select-none">
<svg
viewBox={0 0 ${totalWidth} ${height}}
className="w-full max-w-[160px] h-auto"
role="img"
aria-label={Штрихкод ${value}`}
>
<rect x="0" y="0" width={totalWidth} height={height} fill="#FFFFFF" />
{(() => {
let x = 8;
return bars.map((b, i) => {
const rect = b.fill ? (
<rect key={i} x={x} y={4} width={b.w} height={height - 8} fill="#111827" />
) : null;
x += b.w;
return rect;
});
})()}
</svg>
{showText && (
<span className="text-[10px] font-mono tracking-wider text-stone-800 mt-0.5">{value}</span>
)}
</div>
);
};

// SVG QR-код
const QRCodeSVG = ({ payload, size = 116 }) => {
const text = String(payload || "NEFAZ");
const grid = 21;
const matrix = Array.from({ length: grid }, () => Array(grid).fill(false));

const drawFinder = (r0, c0) => {
for (let r = 0; r < 7; r++) {
for (let c = 0; c < 7; c++) {
const isBorder = r === 0 || r === 6 || c === 0 || c === 6;
const isCenter = r >= 2 && r <= 4 && c >= 2 && c <= 4;
if (r0 + r < grid && c0 + c < grid) {
matrix[r0 + r][c0 + c] = isBorder || isCenter;
}
}
}
};

drawFinder(0, 0);
drawFinder(0, grid - 7);
drawFinder(grid - 7, 0);

let seed = 1337;
for (let i = 0; i < text.length; i++) {
seed = (seed * 16777619) ^ text.charCodeAt(i);
}

for (let r = 0; r < grid; r++) {
for (let c = 0; c < grid; c++) {
const inTopLeft = r < 8 && c < 8;
const inTopRight = r < 8 && c >= grid - 8;
const inBottomLeft = r >= grid - 8 && c < 8;
if (inTopLeft || inTopRight || inBottomLeft) continue;
seed = (seed * 1103515245 + 12345) & 0x7fffffff;
matrix[r][c] = (seed % 100) < 46;
}
}

return (
<div className="inline-flex flex-col items-center bg-white p-2 border border-stone-300 rounded-sm">
<svg width={size} height={size} viewBox={0 0${grid + 2} latex
{grid + 2}`} className="block"&gt; &lt;rect x="0" y="0" width={grid + 2} height={grid + 2} fill="#FFFFFF" /&gt; {matrix.map((row, r) =&gt; row.map((cell, c) =&gt; cell ? ( &lt;rect key={`

{r}-${c}} x={c + 1} y={r + 1} width="1" height="1" fill="#111827" />
) : null
)
)}
</svg>
<span className="text-[10px] font-mono text-stone-700 mt-1 max-w-[150px] truncate">{text}</span>
</div>
);
};

const stopCamera = () => {
if (streamRef.current) {
streamRef.current.getTracks().forEach((t) => t.stop());

}

};

const startCameraScanner = async (mode) => {
stopCamera();
setCameraMode(mode);
setCameraError("");

if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
setCameraError("Камера недоступна в этом браузере. Используйте ручной ввод или выбор из списка.");
return;
}

try {
const stream = await navigator.mediaDevices.getUserMedia({
video: { facingMode: { ideal: "environment" } },
audio: false,
});
streamRef.current = stream;
if (videoRef.current) {
videoRef.current.srcObject = stream;
await videoRef.current.play();
}

if ("BarcodeDetector" in window) {
const formats =
mode === "model-qr" || mode === "account-qr"
? ["qr_code"]
: ["ean_13", "ean_8", "code_128", "code_39", "upc_a", "qr_code"];
const detector = new window.BarcodeDetector({ formats });

const scanLoop = async () => {
if (!streamRef.current || !videoRef.current) return;
try {
if (videoRef.current.readyState === 4) {
const codes = await detector.detect(videoRef.current);
if (codes && codes.length > 0) {
const rawValue = (codes[0].rawValue || "").trim();
if (rawValue) {
handleDetectedCode(mode, rawValue);
return;
}
}
}
} catch (e) {}
if (streamRef.current) {
requestAnimationFrame(scanLoop);
}
};
requestAnimationFrame(scanLoop);
} else {
setCameraError("Автораспознавание в этом браузере не поддерживается — введите значение вручную или выберите ниже.");
}
} catch (err) {
setCameraError("Не удалось открыть камеру. Проверьте разрешение браузера или выберите/введите вручную.");
}
};

}

const handleImportBom = (e) => {
e.preventDefault();
const lines = importText
.split("\n")
.map((l) => l.trim())
.filter(Boolean);

const parsedItems = lines.map((line, idx) => {
const parts = line.split(/[|;\t]/).map((p) => p.trim());
const name = parts[0] || Узел климатической системы №${idx + 1}; const unit = parts[1] || "шт"; const applicability = Math.max(1, parseInt(parts[2], 10) || 1); const barcode = parts[3] && /^\d{8,14}$/.test(parts[3]) ? parts[3] : generateBarcode(name + idx);
return {
id: imp-${Date.now()}-${idx},
name,
unit,
applicability,
barcode,
};
});

if (parsedItems.length === 0) {
showToast("Нет строк для загрузки");
return;
}

...prev,
models: prev.models.map((m) => {

};

const modelObj = state.models.find((m) => m.id === reportModelId) || state.models[0];
if (!modelObj) return [];
const cleanBody = reportBodyNumber.trim().toUpperCase();
const codeFilter = reportCodeFilter.trim().toLowerCase();

return modelObj.bom
.filter((item) => {
if (!codeFilter) return true;
return item.name.toLowerCase().includes(codeFilter) || item.barcode.toLowerCase().includes(codeFilter);
})
.map((item) => {
const matchingIssues = state.issues.filter((iss) => {
const sameModel = iss.modelId === modelObj.id;
const sameBody = cleanBody ? (iss.bodyNumber || "").trim().toUpperCase() === cleanBody : true;
const hasItem = (iss.items || []).some(
(it) => it.itemId === item.id || it.name === item.name
);
return sameModel && sameBody && hasItem;
});

let issuedTotal = 0;
let lastDate = "—";
let lastRecipient = "—";
let lastIssuer = "—";
let lastSerial = "";

matchingIssues.forEach((iss) => {
const found = (iss.items || []).find(
(it) => it.itemId === item.id || it.name === item.name
);
if (found) {
issuedTotal += Number(found.qty) || 0;
if (found.serialNumber) lastSerial = found.serialNumber;
}
lastDate = iss.dateTime;
lastRecipient = iss.recipient;
lastIssuer = iss.issuer;
});

const remaining = Math.max(0, item.applicability - issuedTotal);

return {
id: item.id,
name: item.name,
unit: item.unit,
applicability: item.applicability,
issuedTotal,
remaining,
lastDate,
lastRecipient,
lastIssuer,
lastSerial,
};
});
}, [state.models, state.issues, reportModelId, reportBodyNumber, reportCodeFilter]);

className="w-full bg-white border border-stone-400 rounded-sm px-3 py-2 text-xs"
/>
</div>
<div>
<label className="block text-xs font-bold text-stone-700 mb-1">Должность / роль</label>
<input
type="text"
value={regRole}
onChange={(e) => setRegRole(e.target.value)}
className="w-full bg-white border border-stone-400 rounded-sm px-3 py-2 text-xs"
/>
</div>
<button
type="submit"
className="w-full bg-[#15803D] hover:bg-green-800 text-white font-bold text-xs py-2.5 rounded-sm cursor-pointer"
>
Зарегистрировать аккаунт и получить QR-код
</button>
</form>
)}

{authMode === "my-qr" && (
<div className="p-4 space-y-3 max-h-96 overflow-y-auto">
{state.accounts.map((acc) => (
<div
key={acc.id}
className="bg-white border border-stone-300 rounded-sm p-3 flex items-center justify-between gap-3"
>
<div className="min-w-0">
<div className="text-xs font-bold">{acc.fio}</div>
<div className="text-[11px] text-stone-600">{acc.role}</div>
<div className="text-[10px] font-mono text-stone-500 mt-0.5 break-all">
{acc.qrToken}
</div>
</div>
<QRCodeSVG payload={acc.qrToken} size={86} />
</div>
))}
</div>
)}
</div>
</div>
)}

{/* МОДАЛЬНОЕ ОКНО: БАЗА ДАННЫХ (МОДЕЛИ АВТОБУСА, НОМЕНКЛАТУРА, ЛЮДИ) */}
{dbModalOpen && (
<div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
<div className="bg-[#F9F8F4] border-2 border-[#232A32] rounded-sm w-full max-w-2xl shadow-2xl overflow-hidden my-auto">
<div className="bg-[#232A32] text-white px-4 py-3 flex items-center justify-between">
<div className="text-sm font-bold">База данных системы (CRUD)</div>
<button
onClick={() => setDbModalOpen(false)}
className="text-stone-300 hover:text-white px-2 cursor-pointer"
>
✕
</button>
</div>

<div className="grid grid-cols-3 border-b border-stone-300 bg-[#EFECE4] text-xs font-bold">
<button
type="button"
onClick={() => setDbTab("models")}
className={py-2 cursor-pointer${
dbTab === "models" ? "bg-amber-300 text-stone-950" : "text-stone-700"
}} &gt; Модели автобуса &lt;/button&gt; &lt;button type="button" onClick={() =&gt; setDbTab("items")} className={py-2 cursor-pointer latex
{ dbTab === "items" ? "bg-amber-300 text-stone-950" : "text-stone-700" }`} &gt; Номенклатура &lt;/button&gt; &lt;button type="button" onClick={() =&gt; setDbTab("people")} className={`py-2 cursor-pointer 

{
dbTab === "people" ? "bg-amber-300 text-stone-950" : "text-stone-700"
}`}
>
Люди (получатели)
</button>
</div>

<div className="p-4 max-h-[75vh] overflow-y-auto space-y-4">
{/* База моделей автобусов */}
{dbTab === "models" && (
<div className="space-y-3">
<form onSubmit={handleSaveModel} className="bg-white border border-stone-300 p-3 rounded-sm space-y-2">
<div className="text-xs font-bold">
{editingModelId ? "Редактировать модель автобуса" : "Добавить модель автобуса"}
</div>
{!editingModelId && (
<input
type="text"
placeholder="Код/артикул модели (например: NEFAZ-5299-40-52)"
value={modelFormId}
onChange={(e) => setModelFormId(e.target.value)}
className="w-full bg-stone-50 border border-stone-400 rounded-sm px-2.5 py-1.5 text-xs font-mono"
/>
)}
<input
type="text"
placeholder="Наименование модели автобуса"
value={modelFormName}
onChange={(e) => setModelFormName(e.target.value)}
className="w-full bg-stone-50 border border-stone-400 rounded-sm px-2.5 py-1.5 text-xs"
/>
<div className="flex gap-2">
<button
type="submit"
className="bg-[#15803D] text-white text-xs font-bold px-3 py-1.5 rounded-sm cursor-pointer"
>
{editingModelId ? "Сохранить изменения" : "Добавить модель"}
</button>
{editingModelId && (
<button
type="button"
onClick={() => {
setEditingModelId(null);
setModelFormId("");
setModelFormName("");
}}
className="bg-stone-200 text-xs font-bold px-3 py-1.5 rounded-sm cursor-pointer"
>
Отмена
</button>
)}
</div>
</form>

<div className="space-y-1.5">
{state.models.map((m) => (
<div
key={m.id}
className="bg-white border border-stone-300 rounded-sm p-2.5 flex items-center justify-between gap-2 text-xs"
>
<div className="min-w-0">
<div className="font-bold truncate">{m.name}</div>
<div className="text-[11px] font-mono text-stone-500 truncate">
{m.id} • QR: {m.qrCode}
</div>
</div>
<div className="flex items-center gap-2 shrink-0">
<button
type="button"
onClick={() => {
setEditingModelId(m.id);
setModelFormName(m.name);
}}
className="text-blue-700 font-semibold hover:underline cursor-pointer"
>
Изм.
</button>
<button
type="button"
onClick={() => handleDeleteModel(m.id)}
className="text-red-700 font-semibold hover:underline cursor-pointer"
>
Удал.
</button>
</div>
</div>
))}
</div>
</div>
)}

{/* База номенклатуры */}
{dbTab === "items" && (
<div className="space-y-3">
<div>
<label className="block text-xs font-bold text-stone-700 mb-1">Модель автобуса:</label>
<select
value={itemTargetModelId}
onChange={(e) => {
setItemTargetModelId(e.target.value);
setEditingItemId(null);
}}
className="w-full bg-white border border-stone-400 rounded-sm px-2.5 py-1.5 text-xs font-semibold"
>
{state.models.map((m) => (
<option key={m.id} value={m.id}>
{m.name}
</option>
))}
</select>
</div>

<form onSubmit={handleSaveBomItem} className="bg-white border border-stone-300 p-3 rounded-sm space-y-2">
<div className="text-xs font-bold">
{editingItemId ? "Редактировать номенклатуру" : "Добавить номенклатуру"}
</div>
<input
type="text"
placeholder="Наименование позиции"
value={itemForm.name}
onChange={(e) => setItemForm({ ...itemForm, name: e.target.value })}
className="w-full bg-stone-50 border border-stone-400 rounded-sm px-2.5 py-1.5 text-xs"
/>
<div className="grid grid-cols-3 gap-2">
<input
type="number"
min="1"
placeholder="Применяемость"
value={itemForm.applicability}
onChange={(e) => setItemForm({ ...itemForm, applicability: e.target.value })}
className="bg-stone-50 border border-stone-400 rounded-sm px-2 py-1.5 text-xs"
/>
<select
value={itemForm.unit}
onChange={(e) => setItemForm({ ...itemForm, unit: e.target.value })}
className="bg-stone-50 border border-stone-400 rounded-sm px-2 py-1.5 text-xs"
>
<option value="шт">шт</option>
<option value="компл">компл</option>
<option value="м">м</option>
</select>
<input
type="text"
placeholder="Штрихкод (авто)"
value={itemForm.barcode}
onChange={(e) => setItemForm({ ...itemForm, barcode: e.target.value })}
className="bg-stone-50 border border-stone-400 rounded-sm px-2 py-1.5 text-xs font-mono"
/>
</div>
<div className="flex gap-2">
<button
type="submit"
className="bg-[#15803D] text-white text-xs font-bold px-3 py-1.5 rounded-sm cursor-pointer"
>
{editingItemId ? "Сохранить" : "Добавить позицию"}
</button>
{editingItemId && (
<button
type="button"
onClick={() => {
setEditingItemId(null);
setItemForm({ name: "", unit: "шт", applicability: 1, barcode: "" });
}}
className="bg-stone-200 text-xs font-bold px-3 py-1.5 rounded-sm cursor-pointer"
>
Отмена
</button>
)}
</div>
</form>

<div className="space-y-1.5">
{(state.models.find((m) => m.id === itemTargetModelId)?.bom || []).map((b) => (
<div
key={b.id}
className="bg-white border border-stone-300 rounded-sm p-2 flex items-center justify-between gap-2 text-xs"
>
<div className="min-w-0">
<div className="font-bold truncate">{b.name}</div>
<div className="text-[11px] text-stone-600">
Примен.: {b.applicability} {b.unit} • ШК: <span className="font-mono">{b.barcode}</span>
</div>
</div>
<div className="flex items-center gap-2 shrink-0">
<button
type="button"
onClick={() => {
setEditingItemId(b.id);
setItemForm({
name: b.name,
unit: b.unit,
applicability: b.applicability,
barcode: b.barcode,
});
}}
className="text-blue-700 font-semibold hover:underline cursor-pointer"
>
Изм.
</button>
<button
type="button"
onClick={() => handleDeleteBomItem(itemTargetModelId, b.id)}
className="text-red-700 font-semibold hover:underline cursor-pointer"
>
Удал.
</button>
</div>
</div>
))}
</div>
</div>
)}

{/* База людей (получателей ТМЦ) */}
{dbTab === "people" && (
<div className="space-y-3">
<form onSubmit={handleSavePerson} className="bg-white border border-stone-300 p-3 rounded-sm space-y-2">
<div className="text-xs font-bold">
{editingPersonId ? "Редактировать сотрудника" : "Добавить сотрудника в базу получателей"}
</div>
<input
type="text"
placeholder="ФИО работника"
value={personForm.fio}
onChange={(e) => setPersonForm({ ...personForm, fio: e.target.value })}
className="w-full bg-stone-50 border border-stone-400 rounded-sm px-2.5 py-1.5 text-xs"
/>
<input
type="text"
placeholder="Подразделение / цех / участок"
value={personForm.department}
onChange={(e) => setPersonForm({ ...personForm, department: e.target.value })}
className="w-full bg-stone-50 border border-stone-400 rounded-sm px-2.5 py-1.5 text-xs"
/>
<div className="flex gap-2">
<button
type="submit"
className="bg-[#15803D] text-white text-xs font-bold px-3 py-1.5 rounded-sm cursor-pointer"
>
{editingPersonId ? "Сохранить" : "Добавить в базу"}
</button>
{editingPersonId && (
<button
type="button"
onClick={() => {
setEditingPersonId(null);
setPersonForm({ fio: "", department: "" });
}}
className="bg-stone-200 text-xs font-bold px-3 py-1.5 rounded-sm cursor-pointer"
>
Отмена
</button>
)}
</div>
</form>

<div className="space-y-1.5">
{state.people.map((p) => (
<div
key={p.id}
className="bg-white border border-stone-300 rounded-sm p-2.5 flex items-center justify-between gap-2 text-xs"
>
<div className="min-w-0">
<div className="font-bold truncate">{p.fio}</div>
<div className="text-[11px] text-stone-500 truncate">{p.department}</div>
</div>
<div className="flex items-center gap-2 shrink-0">
<button
type="button"
onClick={() => {
setEditingPersonId(p.id);
setPersonForm({ fio: p.fio, department: p.department });
}}
className="text-blue-700 font-semibold hover:underline cursor-pointer"
>
Изм.
</button>
<button
type="button"
onClick={() => handleDeletePerson(p.id)}
className="text-red-700 font-semibold hover:underline cursor-pointer"
>
Удал.
</button>
</div>
</div>
))}
</div>
</div>
)}
</div>
</div>
</div>
)}

{/* МОДАЛЬНОЕ ОКНО: ЗАГРУЗКА СОСТАВА В МОДЕЛЬ */}
{showImportModal && (
<div className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-3 overflow-y-auto">
<form
onSubmit={handleImportBom}
className="bg-[#F9F8F4] border-2 border-[#232A32] rounded-sm w-full max-w-lg p-4 space-y-3 shadow-xl my-auto"
>
<div className="flex items-center justify-between border-b border-stone-300 pb-2">
<h3 className="text-sm font-bold">Загрузка состава изделия в модель автобуса</h3>
<button
type="button"
onClick={() => setShowImportModal(false)}
className="text-stone-600 font-bold px-2 cursor-pointer"
>
✕
</button>
</div>

<p className="text-xs text-stone-600">
Формат строки: <span className="font-mono">Наименование | Ед.изм | Применяемость | Штрихкод</span>
</p>

<textarea
rows="5"
value={importText}
onChange={(e) => setImportText(e.target.value)}
className="w-full bg-white border border-stone-400 rounded-sm p-2 text-xs font-mono"
/>

<div>
<label className="block text-xs font-bold text-stone-700 mb-1">Модель автобуса:</label>
<select
value={targetModelForImport}
onChange={(e) => setTargetModelForImport(e.target.value)}
className="w-full bg-white border border-stone-400 rounded-sm px-2.5 py-1.5 text-xs font-semibold"
>
{state.models.map((m) => (
<option key={m.id} value={m.id}>
{m.name}
</option>
))}
</select>
</div>

<label className="flex items-center gap-2 text-xs text-stone-700 cursor-pointer">
<input
type="checkbox"
checked={replaceExistingBom}
onChange={(e) => setReplaceExistingBom(e.target.checked)}
/>
<span>Заменить текущий состав модели</span>
</label>

<div className="flex justify-end gap-2 pt-2 border-t border-stone-300">
<button
type="button"
onClick={() => setShowImportModal(false)}
className="px-3 py-1.5 bg-white border border-stone-400 rounded-sm text-xs font-bold cursor-pointer"
>
Отмена
</button>
<button
type="submit"
className="px-4 py-1.5 bg-[#1D4ED8] text-white rounded-sm text-xs font-bold cursor-pointer"
>
Загрузить состав
</button>
</div>
</form>
</div>
)}

{/* МОДАЛЬНОЕ ОКНО: QR-КОД */}
{qrPreview && (
<div
onClick={() => setQrPreview(null)}
className="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4"
>
<div
onClick={(e) => e.stopPropagation()}
className="bg-white border-2 border-[#232A32] rounded-sm p-4 max-w-xs w-full text-center space-y-2 shadow-xl"
>
<div className="text-xs font-bold uppercase text-stone-500">{qrPreview.title}</div>
<div className="text-sm font-bold text-stone-900">{qrPreview.subtitle}</div>
<div className="flex justify-center py-2">
<QRCodeSVG payload={qrPreview.code} size={150} />
</div>
<button
onClick={() => setQrPreview(null)}
className="w-full bg-[#232A32] text-white text-xs font-bold py-2 rounded-sm cursor-pointer"
>
Закрыть
</button>
</div>
</div>
)}
</div>
);
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
